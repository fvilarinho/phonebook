name: Phonebook Build Pipeline

on:
  push:
    branches: [ "*" ]
    paths-ignore:
      - ".gitignore"
      - ".github/release.yml"
      - "*.md"
      - "bin/backup*"
      - "deploy.sh"
      - "etc/backup*"
      - "etc/nginx.conf"
      - "gradle*"
      - "iac/*"
      - "LICENSE"
      - "notify.sh"

permissions:
  contents: read

jobs:
  build:
    name: Jobs
    env:
      SECRETS: ${{ secrets.SECRETS }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the Project Files
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Snyk
        run: npm install --ignore-scripts -g snyk@1.1307.0

      - name: Compile & Build
        run: ./build.sh

      - name: Test & Coverage
        run: ./test.sh

      - name: Code Analysis
        run: ./codeAnalysis.sh

      - name: Libraries Analysis
        run: ./librariesAnalysis.sh

      - name: Packaging
        run: ./package.sh

      - name: Package Analysis
        run: ./packageAnalysis.sh

      - name: Notify
        if: always()
        run: ./notify.sh "build" "${{ job.status }}"
