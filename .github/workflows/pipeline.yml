name: Phonebook Pipeline

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - ".*.template"
      - ".gitignore"
      - "*.md"
      - "banner.txt"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    name: Jobs
    env:
      SECRETS: ${{ secrets.SECRETS }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the Project Files
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Snyk
        run: npm install --ignore-scripts -g snyk@1.1307.0

      - name: Compile & Build
        run: ./build.sh

      - name: Test & Coverage
        run: ./test.sh

      - name: Code Analysis
        run: ./codeAnalysis.sh

      - name: Libraries Analysis
        run: ./librariesAnalysis.sh

      - name: Packaging
        run: ./package.sh

      - name: Package Analysis
        run: ./packageAnalysis.sh

      - name: Publish
        run: ./publish.sh

      - name: Notify
        if: always()
        run: ./notify.sh "${{ job.status }}"