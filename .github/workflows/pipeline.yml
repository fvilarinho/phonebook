name: Phonebook Pipeline

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - ".env.template"
      - ".gitignore"
      - "*.md"
      - "banner.txt"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    name: Jobs
    runs-on: ubuntu-latest

    steps:
      - name: Download the Project Files
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Prepare the Environment
        run: chmod +x *.sh; chmod +x ./bin/*.sh; npm install snyk -g

      - name: Compile & Build
        env:
          BUILD_DEFINITIONS: ${{ secrets.BUILD_DEFINITIONS }}
        run: ./build.sh

      - name: Test & Coverage
        run: ./test.sh

      - name: Code Analysis
        run: ./codeAnalysis.sh

      - name: Libraries Analysis
        run: ./librariesAnalysis.sh

      - name: Packaging
        run: ./package.sh

      - name: Package Analysis
        run: ./packageAnalysis.sh

      - name: Publishing
        run: ./publish.sh

      - name: Notify
        if: always()
        run: ./notify.sh "${{ job.status }}"