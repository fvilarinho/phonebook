// Required plugins (Spring Boot and Java).
plugins {
    id "org.springframework.boot" version "4.1.1"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.sonarqube" version "7.5.0.8588"
    id "java"
    id "jacoco"
}

// Package name.
group = "br.app.vila"

// Compiler compliance.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Code analysis.
sonar {
    properties {
        property "sonar.organization", System.getenv("SONAR_ORGANIZATION")
        property "sonar.projectKey", System.getenv("SONAR_PROJECT_KEY")
        property "sonar.token", System.getenv("SONAR_TOKEN")
        property "sonar.host.url", System.getenv("SONAR_URL")
        property "sonar.coverage.exclusions", "**/PhonebookApplication**"
    }
}

// Coverage reporting.
jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    reports {
        html.required.set(true)
        xml.required.set(true)
        csv.required.set(false)
    }

    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ["**/PhonebookApplication**"])
        })
    }
}

// Dependency repositories.
repositories {
    // Use Maven Central for resolving dependencies.
    maven {
        url "https://repo1.maven.org/maven2"
    }
    mavenCentral()
}

// Dependency list
dependencies {
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-data-mongodb"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.apache.tomcat.embed:tomcat-embed-core:10.1.59"
    implementation "org.mongodb:mongodb-hibernate:1.0.0-alpha1"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.apache.tomcat.embed:tomcat-embed-core:10.1.59"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.mockito:mockito-core:5.15.2"
    testImplementation "org.mockito:mockito-junit-jupiter:5.15.2"
}

// Test workflow.
test {
    useJUnitPlatform()

    finalizedBy jacocoTestReport
}
