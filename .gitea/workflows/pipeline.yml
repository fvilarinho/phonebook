name: Phonebook Pipeline

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - ".env*"
      - "*.md"
      - "banner.txt"
      - "deploy.sh"
      - "docker-compose.yml"
      - "etc/**"
      - "generateCertificateAndCredentials.sh"
      - "LICENSE"
      - "start.sh"
      - "stop.sh"

permissions:
  contents: read

jobs:
  build:
    name: Jobs
    env:
      ENV: ${{ secrets.ENV }}
    runs-on: gitea-runner

    steps:
      - name: Download the project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Test
        run: which java    

