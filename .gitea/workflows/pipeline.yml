name: Phonebook Pipeline

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - ".env.template"
      - ".gitignore"
      - "*.md"
      - "banner.txt"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    name: Jobs
    runs-on: gitea-runner

    steps:
      - name: Download the Project Files
        uses: actions/checkout@v4

      - name: Prepare the Environment
        run: chmod +x *.sh; chmod +x ./bin/*.sh;

      - name: Notify when start
        run: ./notify.sh "{{ job }}"

      - name: Compile & Build
        env:
          BUILD_DEFINITIONS: ${{ secrets.BUILD_DEFINITIONS }}
        run: ./build.sh

      - name: Test & Coverage
        run: ./test.sh

      - name: Code Analysis
        run: ./codeAnalysis.sh

      - name: Libraries Analysis
        run: ./librariesAnalysis.sh

      - name: Packaging
        run: ./package.sh

      - name: Package Analysis
        run: ./packageAnalysis.sh

      - name: Publishing
        run: ./publish.sh

      - name: Deploy
        env:
          PROVISIONING_STATE_CREDENTIALS: ${{ secrets.PROVISIONING_STATE_CREDENTIALS }}
          PROVISIONING_DEFINITIONS: ${{ secrets.PROVISIONING_DEFINITIONS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          CERTIFICATE_KEY: ${{ secrets.CERTIFICATE_KEY }}
        run: ./deploy.sh

      - name: Notify if fails
        if: failure()
        run: ./notify.sh Fails