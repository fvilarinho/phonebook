global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9091'

  - job_name: 'nginx'
    static_configs:
      - targets:
          - 'nginx-exporter:9092'

  - job_name: 'phonebook'
    static_configs:
      - targets:
          - 'phonebook:9093'

  - job_name: 'mariadb'
    static_configs:
      - targets:
          - 'mariadb-exporter:9094'
