apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: database
spec:
  selector:
    app: mariadb
  ports:
    - name: tcp
      port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: phonebook
  namespace: backend
spec:
  selector:
    app: phonebook
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: frontend
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
    - name: https
      port: 443