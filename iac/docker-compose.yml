  phonebook:
    build: ..
    image: ${DOCKER_REGISTRY_URL}/${DOCKER_REGISTRY_ID}/${APP_NAME}:${BUILD_VERSION}
    container_name: phonebook
    restart: always
    environment:
#      - OBSERVABILITY_ENABLED=true
#      - METRICS_HOST=${METRICS_HOST}
#      - TRACES_HOST+=${TRACES_HOST}
#      - LOGS_HOST=${LOGS_HOST}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    volumes:
      - ../etc/logback.xml:/home/phonebook/etc/logback.xml
    hostname: phonebook
    #ports:
    #  - "8080:8080"
    #  - "9093:9893"
    depends_on:
      - mariadb
#      - jaeger
#      - fluentd

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
    volumes:
      - mariadb_data:/var/lib/mysql
    hostname: mariadb
